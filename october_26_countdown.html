<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>October 26 — Countdown</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    overflow: hidden;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    background:
      radial-gradient(circle at 50% 42%, rgba(124,58,237,.28), transparent 28%),
      radial-gradient(circle at 20% 20%, rgba(14,165,233,.15), transparent 25%),
      linear-gradient(135deg, #050816, #0b1025 50%, #02030a);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .noise {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  }
  .wrap {
    position: relative; z-index: 2; min-height: 100vh;
    display: grid; place-items: center; padding: 28px;
  }
  .card {
    width: min(1050px, 100%);
    text-align: center;
    padding: clamp(34px, 7vw, 78px);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 32px;
    background: rgba(7,10,25,.56);
    backdrop-filter: blur(22px);
    box-shadow: 0 30px 100px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.08);
  }
  .event-title { font-size: clamp(30px, 5vw, 58px); font-weight: 900; letter-spacing: -.045em; margin-top: 4px; }
.doomsday { color: #ef233c; font-size: clamp(32px, 5.5vw, 66px); font-weight: 950; letter-spacing: .02em; text-shadow: 0 0 24px rgba(239,35,60,.35); margin: 2px 0 18px; }
.eyebrow {
    letter-spacing: .35em; text-transform: uppercase; font-size: 12px;
    color: #a5b4fc; font-weight: 700; margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(48px, 10vw, 120px);
    line-height: .9;
    letter-spacing: -.065em;
    background: linear-gradient(100deg, #fff, #c4b5fd 45%, #67e8f9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 50px rgba(129,140,248,.18);
  }
  .subtitle { color: #aab1c5; margin: 22px 0 40px; font-size: clamp(14px, 2vw, 18px); }
  .timer {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    max-width: 820px; margin: auto;
  }
  .unit {
    position: relative; padding: 24px 10px 20px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    border: 1px solid rgba(255,255,255,.1);
    overflow: hidden;
  }
  .unit::after {
    content:""; position:absolute; width:80px; height:80px; border-radius:50%;
    right:-35px; top:-40px; background: rgba(99,102,241,.18); filter: blur(8px);
  }
  .num { font-variant-numeric: tabular-nums; font-size: clamp(38px, 7vw, 72px); font-weight: 800; letter-spacing: -.05em; }
  .label { margin-top: 4px; color:#8d96ad; text-transform:uppercase; letter-spacing:.2em; font-size:10px; font-weight:700; }
  .target { margin-top: 34px; color:#6f7890; font-size:12px; }
  .pulse {
    display:inline-block; width:7px; height:7px; border-radius:50%; background:#67e8f9;
    box-shadow:0 0 15px #67e8f9; margin-right:8px; animation:pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { opacity:.25; transform:scale(.65); } }
  .done { display:none; font-size:clamp(40px,8vw,90px); font-weight:900; }
  @media (max-width:650px) {
    .timer { grid-template-columns: repeat(2,1fr); }
    .card { border-radius:24px; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="noise"></div>
<main class="wrap">
  <section class="card">
    <div class="eyebrow">The countdown is on</div>
<div class="event-title">Ethan's 15th.</div>
<div class="doomsday">DOOMSDAY.</div>
<h1>OCTOBER 26</h1>
    <p class="subtitle"><span class="pulse"></span>Counting down to midnight</p>

    <div class="timer" id="timer">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>
    <div class="done" id="done">IT'S HERE.</div>
    <div class="target">OCTOBER 26, 2026 · 12:00 AM · YOUR LOCAL TIME</div>
  </section>
</main>

<script>
  const target = new Date("2026-10-26T00:00:00");
  const ids = ["days","hours","minutes","seconds"];

  function tick() {
    const diff = target - new Date();
    if (diff <= 0) {
      document.getElementById("timer").style.display = "none";
      document.getElementById("done").style.display = "block";
      return;
    }
    const values = [
      Math.floor(diff / 86400000),
      Math.floor(diff / 3600000) % 24,
      Math.floor(diff / 60000) % 60,
      Math.floor(diff / 1000) % 60
    ];
    ids.forEach((id, i) => document.getElementById(id).textContent = String(values[i]).padStart(2,"0"));
  }
  tick(); setInterval(tick, 250);

  // Subtle animated star field
  const c = document.getElementById("stars"), ctx = c.getContext("2d");
  let stars = [];
  function resize() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    stars = Array.from({length: Math.min(180, Math.floor(innerWidth/7))}, () => ({
      x: Math.random()*innerWidth, y: Math.random()*innerHeight,
      r: Math.random()*1.5+.2, a: Math.random()*.7+.1, s: Math.random()*.25+.05
    }));
  }
  function draw() {
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const s of stars) {
      s.y -= s.s; if (s.y < -3) { s.y = innerHeight+3; s.x=Math.random()*innerWidth; }
      ctx.globalAlpha=s.a; ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener("resize", resize); resize(); draw();
</script>
</body>
</html>
